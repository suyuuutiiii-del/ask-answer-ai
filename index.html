<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask & Get Answer</title><style>body{font-family:Arial,sans-serif;background:#f4f7f5;margin:0;color:#17231c}.wrap{max-width:650px;margin:auto;padding:22px}.head{text-align:center;background:#176b45;color:white;padding:22px;border-radius:18px;margin-bottom:18px}h1{margin:0;font-size:28px}.card{background:white;padding:18px;border-radius:18px;margin:14px 0;box-shadow:0 4px 16px #0001}textarea{display:block;width:100%;box-sizing:border-box;min-height:150px;border:2px solid #d8e2dc;border-radius:14px;padding:14px;font-size:18px;resize:vertical}.buttons{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:13px 18px;font-size:17px;font-weight:bold}.speak{background:#e9f5ef;color:#176b45}.ask{background:#176b45;color:white;flex:1}.answer{min-height:120px;font-size:18px;line-height:1.55;white-space:pre-wrap}.read{background:#eef1ff;color:#303f9f}button:disabled{opacity:.55}</style></head><body><div class="wrap"><div class="head"><h1>Ask & Get Answer</h1><div>Type or speak your question</div></div><div class="card"><h2>Ask Your Question</h2><textarea id="q" inputmode="text" enterkeyhint="send" placeholder="Tap here and type your question…"></textarea><div class="buttons"><button class="speak" id="mic">🎤 Speak</button><button class="ask" id="ask">➤ Ask AI</button></div></div><div class="card"><h2>Your Answer</h2><div id="a" class="answer">Your AI answer will appear here.</div><div class="buttons"><button class="read" id="read">🔊 Read Answer</button></div></div></div><script>const q=document.getElementById('q'),a=document.getElementById('a'),ask=document.getElementById('ask');ask.onclick=async()=>{let question=q.value.trim();if(!question){a.textContent='Please type or speak a question first.';q.focus();return}ask.disabled=true;a.textContent='Thinking…';try{let r=await fetch('/.netlify/functions/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});let d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to get an answer.');a.textContent=d.answer||'No answer was returned.'}catch(e){a.textContent='AI connection error: '+e.message}finally{ask.disabled=false}};document.getElementById('read').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(a.textContent))};document.getElementById('mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){a.textContent='Speech input is not supported here. Please type instead.';return}let r=new SR();r.lang='en-NG';r.onresult=e=>q.value=e.results[0][0].transcript;r.onerror=e=>a.textContent='Microphone error: '+e.error;r.start()};</script></body></html>
